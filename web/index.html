<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A private diary for two.">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- The bar behind the clock follows the app's theme: black in dark mode,
       cream in light mode. -->
  <meta name="theme-color" content="#FEFAF3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <style>
    html, body { background: #FEFAF3; margin: 0; }
    @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
    /* Shown the instant the app is opened, until Flutter draws its first frame. */
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: inherit; z-index: 10; transition: opacity .25s ease;
    }
    #splash img { width: 72px; height: 72px; animation: breathe 1.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
  </style>
  <!-- Start the first screen's fonts and logo right away, alongside the app
       code, instead of after it. -->
  <link rel="preload" href="assets/assets/fonts/GoogleSans.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/GoogleSansFlex.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/MomoSignature.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/icons/logo.png" as="image">
  <meta name="apple-mobile-web-app-title" content="Diary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Our Diary</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash"><img src="assets/assets/icons/logo.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
